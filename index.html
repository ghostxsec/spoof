<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWNED BY BADCAT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #080b14;
  }

  /* Kanvas background */
  #bg {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* Teks di tengah */
  .wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 2;
    padding: 0 4vw;
  }

  h1 {
    font-family: "Segoe UI", "Arial Black", system-ui, sans-serif;
    font-size: clamp(22px, 6vw, 90px);   /* <-- diperkecil */
    font-weight: 900;
    letter-spacing: .06em;                /* <-- dirapatkan */
    text-indent: .06em;
    white-space: nowrap;
    text-align: center;

    background: linear-gradient(180deg, #ffffff 0%, #bfe4ff 35%, #5aaeff 65%, #1e5bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    -webkit-text-stroke: 2px rgba(255, 255, 255, .30);
    filter:
      drop-shadow(0 0 18px rgba(64, 150, 255, .65))
      drop-shadow(0 0 50px rgba(30, 90, 255, .45));

    user-select: none;
    animation: float 3.6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(-8px) scale(1); }
    50%      { transform: translateY(8px)  scale(1.025); }
  }

  /* Efek vignette supaya pinggiran gelap, fokus ke tengah */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0) 25%,
      rgba(0, 0, 0, .55) 70%,
      rgba(0, 0, 0, .85) 100%
    );
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="wrap">
  <h1>PWNED BY BADCAT</h1>
</div>
 <a href="javascript:alert(1)">HALO</a>
<img src=x onerror=alert(1)>
 <iframe src="https://bug1337756.bmoattachments.org/attachment.cgi?id=8834876"></iframe>
<div class="vignette"></div>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Parameter animasi ----
  const TILE = 84;
  const SPEED = 34;

  let t = 0;
  let last = performance.now();

  let mx = W / 2, my = H / 2;
  let tx = W / 2, ty = H / 2;

  window.addEventListener('mousemove', (e) => {
    tx = e.clientX;
    ty = e.clientY;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }
  }, { passive: true });

  const COLOR_A = '#0f1626';
  const COLOR_B = '#090e1a';

  function draw() {
    ctx.fillStyle = '#070a12';
    ctx.fillRect(0, 0, W, H);

    const ox = (t * SPEED) % (TILE * 2);
    const oy = (t * SPEED * 0.5) % (TILE * 2);

    const cols = Math.ceil(W / TILE) + 4;
    const rows = Math.ceil(H / TILE) + 4;
    const baseI = -2, baseJ = -2;

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const gx = baseI + i;
        const gy = baseJ + j;

        const x = gx * TILE + ox;
        const y = gy * TILE + oy;

        if (x > W || y > H || x + TILE < 0 || y + TILE < 0) continue;

        const even = ((gx + gy) & 1) === 0;
        ctx.fillStyle = even ? COLOR_A : COLOR_B;
        ctx.fillRect(x, y, TILE, TILE);

        ctx.strokeStyle = 'rgba(120, 180, 255, 0.045)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, TILE, TILE);
      }
    }

    const p = ((t * 0.10) % 1.4) - 0.2;
    const bandX = p * (W + H) - H;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const band = ctx.createLinearGradient(bandX, 0, bandX + H * 0.9, H);
    band.addColorStop(0,   'rgba(40, 110, 255, 0)');
    band.addColorStop(0.5, 'rgba(60, 140, 255, 0.10)');
    band.addColorStop(1,   'rgba(40, 110, 255, 0)');
    ctx.fillStyle = band;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    mx += (tx - mx) * 0.08;
    my += (ty - my) * 0.08;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(
      mx, my, 0,
      mx, my, Math.max(W, H) * 0.45
    );
    glow.addColorStop(0,   'rgba(90, 160, 255, 0.20)');
    glow.addColorStop(0.45,'rgba(50, 100, 230, 0.08)');
    glow.addColorStop(1,   'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    t += dt;

    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
